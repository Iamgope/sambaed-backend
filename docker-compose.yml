services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaad_vivaad
      POSTGRES_USER: vaad
      POSTGRES_PASSWORD: vaad
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaad -d vaad_vivaad"]
      interval: 3s
      timeout: 5s
      retries: 5

  web:
    build: .
    # Project tree is bind-mounted below so local edits are visible in the
    # container. watchfiles restarts Daphne on .py changes (Daphne has no
    # built-in --reload for ASGI).
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py collectstatic --noinput
        python manage.py migrate --noinput
        python -m watchfiles --filter python --ignore-paths "postgres_data,.git,__pycache__,staticfiles" "daphne -b 0.0.0.0 -p 8000 project.asgi:application" /app
    environment:
      DJANGO_SETTINGS_MODULE: project.settings
      # SECRET_KEY: django-insecure-docker-only-change-for-production
      DEBUG: True
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      DB_NAME: vaad_vivaad
      DB_USER: vaad
      DB_PASSWORD: vaad
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app:cached
    # Optional: set Google OAuth and other variables in a .env file
    env_file:
      - .env
