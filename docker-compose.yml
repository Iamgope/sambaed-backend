services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaad_vivaad
      POSTGRES_USER: vaad
      POSTGRES_PASSWORD: vaad
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaad -d vaad_vivaad"]
      interval: 3s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.0-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: vaad
      RABBITMQ_DEFAULT_PASS: vaad
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  web:
    build: .
    # Project tree is bind-mounted below so local edits are visible in the
    # container. watchfiles restarts Daphne on .py changes (Daphne has no
    # built-in --reload for ASGI).
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py collectstatic --noinput
        python manage.py migrate --noinput
        python -m watchfiles --filter python --ignore-paths "postgres_data,.git,__pycache__,staticfiles" "daphne -b 0.0.0.0 -p 8000 project.asgi:application" /app
    environment:
      DJANGO_SETTINGS_MODULE: project.settings
      # SECRET_KEY: django-insecure-docker-only-change-for-production
      DEBUG: True
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      DB_NAME: vaad_vivaad
      DB_USER: vaad
      DB_PASSWORD: vaad
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: amqp://vaad:vaad@rabbitmq:5672/test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app:cached
    env_file:
      - .env

  celery:
    build: .
    command: celery -A project worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: project.settings
      DEBUG: True
      DB_NAME: vaad_vivaad
      DB_USER: vaad
      DB_PASSWORD: vaad
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: amqp://vaad:vaad@rabbitmq:5672/test
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app:cached
    env_file:
      - .env
